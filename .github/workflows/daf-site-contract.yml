name: DAF site contract

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  site-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Validate component logic
        run: node --check tools/render-check.js
      - name: Exercise render, data and offline states
        run: node tools/render-check.js
      - name: Check whitespace errors
        run: git diff --check
