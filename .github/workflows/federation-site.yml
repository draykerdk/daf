name: Federation site

# Builds the site and deploys it to GitHub Pages from the workflow artifact.
# Every build generates data/federation.json, data/events.json and
# data/events.log with `node tools/daf.js snapshot`, from the record in this
# checkout and the open issues, and assembles _site/ from an explicit list of
# files: tools/ is never published, so its test fixtures never reach the site.
# The founding ruleset protects master (no direct pushes, required
# component-contract check), so the generated snapshot is not committed back;
# the repository remains the record, and the Pages artifact is only a reading
# surface generated from it. Same pattern as draykerdk/general-forum.
#
# Never add a pull_request or pull_request_target trigger here: the github-pages
# environment deploys only from master, and code from a pull request must never
# run with the Pages token.

on:
  push:
    branches:
      - master
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
  # Cycle, claim and request issues change what the site lists, so it is rebuilt
  # when one opens, changes or closes. Other issues and bot activity do not.
  issues:
    types: [opened, edited, closed, reopened]

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name != 'issues' ||
      ((startsWith(github.event.issue.title, '[Cycle]') ||
        startsWith(github.event.issue.title, '[Claim]') ||
        startsWith(github.event.issue.title, '[Request]')) &&
       github.event.sender.type != 'Bot')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read the open issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Any API error fails the job, so the last good deployment stays live.
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" > "$RUNNER_TEMP/issues.json"

      - name: Generate the snapshot
        run: |
          set -euo pipefail
          node tools/daf.js snapshot --out _site/data --issues "$RUNNER_TEMP/issues.json" --commit "$GITHUB_SHA"

      - name: Assemble the site
        run: |
          set -euo pipefail
          # The published files, listed one by one. tools/ is never in this list.
          SITE_FILES=(index.html support.js drayker-mark.js drayker-favicon.svg favicon.ico CNAME robots.txt sitemap.xml llms.txt LICENSE README.md)
          SITE_DIRS=(dafp federation)
          for f in "${SITE_FILES[@]}"; do cp "$f" _site/; done
          for d in "${SITE_DIRS[@]}"; do cp -R "$d" _site/; done
          find _site -type f | sort

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      # Here rather than in build: it reads the Pages settings, and only this job
      # holds a Pages permission.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
