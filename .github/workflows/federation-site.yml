name: Federation site

# Builds the site and deploys it to GitHub Pages from the workflow artifact,
# regenerating data/federation.json at every build. The founding ruleset
# protects master (no direct pushes, required component-contract check), and
# workflow runs on bot-opened pull requests cannot be approved — so committing
# the snapshot back to master is not possible, and the artifact is the record.
# Same pattern as draykerdk/general-forum.

on:
  push:
    branches:
      - master
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the record
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p data

          listdir () {
            gh api "repos/${GITHUB_REPOSITORY}/contents/$1" --jq \
              '[ .[] | select(.type=="file")
                     | select(.name | test("^TEMPLATE\\.";"i") | not)
                     | select(.name | test("^README";"i") | not)
                     | {name: .name, url: .html_url} ]' 2>/dev/null || echo '[]'
          }

          listdir federation/units       > /tmp/units.json
          listdir federation/assemblies  > /tmp/assemblies.json
          listdir federation/requests    > /tmp/requests.json

          gh api "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=30" --jq \
            '[ .[] | {num: .number, title: .title, url: .html_url, pr: (has("pull_request"))} ]' \
            > /tmp/issues.json || echo '[]' > /tmp/issues.json

          jq -n \
            --slurpfile units /tmp/units.json \
            --slurpfile assemblies /tmp/assemblies.json \
            --slurpfile requests /tmp/requests.json \
            --slurpfile issues /tmp/issues.json \
            --arg generated "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{generated: $generated,
              units: $units[0],
              assemblies: $assemblies[0],
              requests: $requests[0],
              issues: $issues[0]}' > data/federation.json

          cat data/federation.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
