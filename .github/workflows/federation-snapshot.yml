name: Federation snapshot

# Commits data/federation.json in the exact shape drayker.org/#org/daf consumes, so
# the page reads the record without depending on the GitHub API at page load. The
# site prefers this file and lets the live API only refresh it.

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'federation/**'

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the record
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p data

          listdir () {
            gh api "repos/${GITHUB_REPOSITORY}/contents/$1" --jq \
              '[ .[] | select(.type=="file")
                     | select(.name | test("^TEMPLATE\\.";"i") | not)
                     | select(.name | test("^README";"i") | not)
                     | {name: .name, url: .html_url} ]' 2>/dev/null || echo '[]'
          }

          listdir federation/units       > /tmp/units.json
          listdir federation/assemblies  > /tmp/assemblies.json
          listdir federation/requests    > /tmp/requests.json

          gh api "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=30" --jq \
            '[ .[] | {num: .number, title: .title, url: .html_url, pr: (has("pull_request"))} ]' \
            > /tmp/issues.json || echo '[]' > /tmp/issues.json

          jq -n \
            --slurpfile units /tmp/units.json \
            --slurpfile assemblies /tmp/assemblies.json \
            --slurpfile requests /tmp/requests.json \
            --slurpfile issues /tmp/issues.json \
            --arg generated "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{generated: $generated,
              units: $units[0],
              assemblies: $assemblies[0],
              requests: $requests[0],
              issues: $issues[0]}' > data/federation.json

          cat data/federation.json

      - name: Commit if it changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # git diff alone misses the first run, when the file is still untracked.
          if git diff --quiet -- data/federation.json \
             && [ -z "$(git status --porcelain -- data/federation.json)" ]; then
            echo "no change"
            exit 0
          fi
          # master is protected ("Founding protection for master"): changes go
          # through a pull request, and the component-contract check is required
          # before merge. Open the PR from a branch and merge once it is green.
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="snapshot-$(date -u +%Y%m%d%H%M%S)"
          git checkout -b "$branch"
          git add data/federation.json
          git commit -m "federation snapshot"
          git push -u origin "$branch"
          gh pr create --base master --head "$branch" \
            --title "federation snapshot" \
            --body "Automatic snapshot of the record, generated by the Federation snapshot workflow."
          gh pr checks "$branch" --watch --interval 10
          gh pr merge "$branch" --merge --delete-branch
