name: Federation tally

# A computation aid that a person runs by hand (Actions > Federation tally >
# Run workflow) on an assembly pull request. It reads the pull request's votes
# (comments, reviews and review comments), reads the record at the pull
# request's head as data only, and runs `node tools/daf.js tally` from the
# default branch. With `post` off it writes the tally to the run summary; with
# `post` on it keeps one comment on the pull request up to date.
#
# It never merges, never approves, never labels and never edits the report.
# The vote table in the report is still written and merged by a person.

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Number of the assembly pull request
        type: number
        required: true
      post:
        description: Post or update the tally comment on the pull request; otherwise write it to the run summary
        type: boolean
        default: false

permissions: {}

concurrency:
  group: daf-tally-${{ inputs.pr }}
  cancel-in-progress: true

jobs:
  tally:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # The tools always come from the default branch, whatever branch the run
      # was started from. Nothing from the pull request is ever executed.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Check the input
        env:
          PR: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          if ! [[ "$PR" =~ ^[0-9]+$ ]] || [ "$PR" = "0" ]; then
            echo "::error::pr must be a pull request number"
            exit 1
          fi

      - name: Read the pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" > "$RUNNER_TEMP/pr.json"
          head="$(jq -r '.head.sha' "$RUNNER_TEMP/pr.json")"
          state="$(jq -r '.state' "$RUNNER_TEMP/pr.json")"
          if ! [[ "$head" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::could not read the head commit of pull request #$PR"
            exit 1
          fi
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$PR/files" > "$RUNNER_TEMP/files.json"
          # An assembly report adds exactly one federation/assemblies/YYYY-MM.md.
          jq -r '[ .[][] | select(.status == "added") | .filename
                   | select(startswith("federation/assemblies/")) ] | .[]' \
            "$RUNNER_TEMP/files.json" > "$RUNNER_TEMP/added.txt"
          count="$(grep -c . "$RUNNER_TEMP/added.txt" || true)"
          report="$(head -n 1 "$RUNNER_TEMP/added.txt")"
          if [ "$count" != "1" ] || ! [[ "$report" =~ ^federation/assemblies/([0-9]{4}-(0[1-9]|1[0-2]))\.md$ ]]; then
            echo "::error::this pull request is not an assembly report: it must add exactly one federation/assemblies/YYYY-MM.md"
            exit 1
          fi
          cycle="${BASH_REMATCH[1]}"
          echo "Pull request #$PR is $state; head $head; report $report; cycle $cycle."
          {
            echo "head=$head"
            echo "state=$state"
            echo "cycle=$cycle"
          } >> "$GITHUB_OUTPUT"

      - name: Fetch the pull request head as data
        env:
          PR: ${{ inputs.pr }}
          HEAD: ${{ steps.pr.outputs.head }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "refs/pull/$PR/head"
          fetched="$(git rev-parse FETCH_HEAD)"
          if [ "$fetched" != "$HEAD" ]; then
            echo "::error::the pull request moved while this ran (API head $HEAD, fetched $fetched); run it again"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/prhead"
          git archive FETCH_HEAD federation dafp | tar -x -C "$RUNNER_TEMP/prhead"
          # Files only: a symbolic link could make the tools read outside the record.
          if [ -n "$(find "$RUNNER_TEMP/prhead" -type l -print -quit)" ]; then
            echo "::error::the pull request head holds a symbolic link under federation/ or dafp/; refusing to read it"
            exit 1
          fi

      - name: Read the votes
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/$PR/comments" > "$RUNNER_TEMP/comments.json"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" > "$RUNNER_TEMP/reviews.json"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$PR/comments" > "$RUNNER_TEMP/review-comments.json"

      - name: Count
        env:
          PR: ${{ inputs.pr }}
          HEAD: ${{ steps.pr.outputs.head }}
          CYCLE: ${{ steps.pr.outputs.cycle }}
        run: |
          set -euo pipefail
          node tools/daf.js tally --cycle "$CYCLE" --record "$RUNNER_TEMP/prhead" \
            --comments "$RUNNER_TEMP/comments.json" \
            --reviews "$RUNNER_TEMP/reviews.json" \
            --review-comments "$RUNNER_TEMP/review-comments.json" \
            --pr "$PR" --head "$HEAD" > "$RUNNER_TEMP/tally.md"

      - name: Write the summary or the comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
          POST: ${{ inputs.post }}
        run: |
          set -euo pipefail
          if [ "$POST" != "true" ]; then
            cat "$RUNNER_TEMP/tally.md" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          marker='<!-- daf-tally:v1 -->'
          { printf '%s\n' "$marker"; cat "$RUNNER_TEMP/tally.md"; } > "$RUNNER_TEMP/body.md"
          jq -n --rawfile body "$RUNNER_TEMP/body.md" '{body: $body}' > "$RUNNER_TEMP/payload.json"
          # Which comment of ours to keep: tools/lib/sticky.js, tested in tools/test.
          node tools/sticky.js --comments "$RUNNER_TEMP/comments.json" --marker "$marker" > "$RUNNER_TEMP/sticky.json"
          patch="$(jq -r '.patch // empty' "$RUNNER_TEMP/sticky.json")"
          # Always an issue comment: a review or a line comment would open a
          # review thread, and an unresolved thread blocks the merge.
          if [ -n "$patch" ]; then
            [[ "$patch" =~ ^[0-9]+$ ]] || { echo "::error::unexpected comment id"; exit 1; }
            url="$(gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$patch" --input "$RUNNER_TEMP/payload.json" --jq '.html_url')"
          else
            url="$(gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --input "$RUNNER_TEMP/payload.json" --jq '.html_url')"
          fi
          for id in $(jq -r '.delete[]' "$RUNNER_TEMP/sticky.json"); do
            [[ "$id" =~ ^[0-9]+$ ]] || { echo "::error::unexpected comment id"; exit 1; }
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/comments/$id"
          done
          echo "Tally comment: $url" >> "$GITHUB_STEP_SUMMARY"
